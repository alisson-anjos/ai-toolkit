job: extension
config:
  name: h3_molmo_targeted_rl_v1
  process:
  - type: sd_trainer
    training_folder: /workspace/ai-toolkit/output
    device: cuda:0
    network:
      type: lora
      linear: 32
      linear_alpha: 32
      network_kwargs:
        ignore_if_contains:
        - audio_model
        - connectors
        - video_to_audio_attn
        - audio_to_video_attn
        - patchify_proj
        - proj_out
        - scale_shift_table
        - prompt_scale_shift_table
        - norm_q
        - norm_k
        - audio_
      pretrained_lora_path: /workspace/checkpoints/source_photo_pilot_delta.safetensors
    save:
      dtype: bf16
      save_every: 1
      max_step_saves_to_keep: 3
    datasets:
    - folder_path: /workspace/datasets/targeted_rl/targets
      control_path:
      - /workspace/datasets/targeted_rl/control_0
      - /workspace/datasets/targeted_rl/control_1
      control_role_1: guide
      control_role_2: reference
      caption_ext: txt
      caption_dropout_rate: 0.0
      resolution:
      - 384
      buckets: true
      num_frames: 49
      fps: 24
      shrink_video_to_frames: true
      flip_x: false
      flip_y: false
      cache_latents_to_disk: true
      cache_text_embeddings: true
      num_repeats: 1
      source_person_path: /workspace/datasets/targeted_rl/source_people
      num_workers: 0
      batch_load_threads: 1
      cache_latents_num_workers: 1
      pin_memory: false
    train:
      batch_size: 1
      steps: 50
      gradient_accumulation: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      timestep_type: shift
      optimizer: adamw8bit
      lr: 1.0e-05
      lr_scheduler: cosine
      dtype: bf16
      cache_text_embeddings: true
      unload_text_encoder: true
      disable_sampling: true
      blank_prompt_preservation: false
      skip_first_sample: true
      bfs_nft:
        group: 2
        steps: 10
        rollout_steps: 4
        rollout_turbo: true
        train_fraction: 0.1
        mix_beta: 0.1
        adv_clip_max: 5.0
        ref_kl_coef: 0.0001
        kl_anchor: init
        decay_schedule: copy
        update_interval: 1
        weights:
          id: 0.0
          bg: 0.0
          light: 0.0
          pose: 0.0
          lips: 0.0
          gpt_id: 1.0
        reward_python: ''
        reward_worker: bfs_targeted_reward_worker.py
        judge_context_root: /workspace/datasets/targeted_rl/judge_context
        judge_gate: 0.1
        skip_failed_groups: true
        keep_rollouts: 2
    model:
      name_or_path: Comfy-Org/MiniMax-H3
      arch: minimax_h3_ref2va
      assistant_lora_path: /workspace/models/loras/minimax_h3_ref2va_training_adapter_v2.safetensors
      quantize: true
      qtype: convrot8
      quantize_te: false
      low_vram: true
      layer_offloading: true
      layer_offloading_transformer_percent: 0.85
      layer_offloading_text_encoder_percent: 0.0
      model_kwargs:
        partition: ref2va_pruned
        dit_ref2va_pruned_path: /workspace/models/diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors
        video_vae_path: /workspace/models/vae/minimax_h3_video_vae_fp16.safetensors
        frozen_base_lora_path: /workspace/models/loras/minimax_h3_character_swap_v1.1_ref2va_fro.safetensors
        align_video_refs: true
        guide_latent_only: false
        guide_rope_layout: overlap
        reference_rope_layout: native
        molmo_model_path: /workspace/models/Molmo2-8B
        molmo_projection_path: /workspace/models/clip_projections/molmo2-8b-h3-tap24-phaseb-pilot.safetensors
        molmo_python_path: /opt/molmo/bin/python
        molmo_phase_b_vision: true
        molmo_max_video_frames: 8
        reference_downscale_factor: 1
        audio_vae_path: /workspace/models/vae/minimax_h3_audio_vae_fp32.safetensors
        nft_turbo_lora_path: /workspace/models/loras/turbo_dmad_4step.safetensors
    sample:
      sample_every: 100000
      samples: []
meta:
  name: h3_molmo_targeted_rl_v1
  version: '1.0'
